html/head_include="<style>\n/* Portrait phones only: pointer:coarse keeps this away from every desktop. */\n#rotate-gate{display:none}\n@media (orientation:portrait) and (pointer:coarse){#rotate-gate{display:flex}}\n#rotate-gate{position:fixed;inset:0;z-index:1000;background:#170f0d;color:#f5ebd9;\nflex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px;\ntext-align:center;font:16px/1.6 system-ui,-apple-system,sans-serif}\n#rotate-gate b{font-size:22px;color:#eec766}\n#rotate-gate button{font:600 16px system-ui,sans-serif;color:#f5ebd9;background:#4d382a;\nborder:2px solid #eec766;border-radius:10px;padding:14px 24px}\n</style>\n<script>\n// Landscape cannot be forced from a web page. screen.orientation.lock() only\n// works inside fullscreen and only on Android; iOS Safari supports neither on\n// iPhone. So the gate ASKS, and the button is a best effort that fails quietly.\naddEventListener(\"DOMContentLoaded\",function(){\nvar g=document.createElement(\"div\");\ng.id=\"rotate-gate\";\ng.innerHTML='<b>Xoay ngang m\\u00e1y \\u0111\\u1ec3 ch\\u01a1i</b><div>Domino Focus c\\u1ea7n m\\u00e0n h\\u00ecnh n\\u1eb1m ngang.</div>';\nvar b=document.createElement(\"button\");\nb.textContent=\"To\\u00e0n m\\u00e0n h\\u00ecnh & xoay ngang\";\nb.onclick=function(){\nvar e=document.documentElement;\nPromise.resolve(e.requestFullscreen?e.requestFullscreen():Promise.reject())\n.then(function(){return screen.orientation&&screen.orientation.lock?screen.orientation.lock(\"landscape\"):null;})\n.catch(function(){});\n};\ng.appendChild(b);\ndocument.body.appendChild(g);\n});\n</script>"
